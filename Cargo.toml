[package]
name = "cargo-leptosx"
version = "0.1.0"
edition = "2021"
description = "Scaffold Leptos frontend projects with file-based routing and feature management"
license = "MIT OR Apache-2.0"
keywords = ["leptos", "scaffold", "wasm", "router", "cli"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[[bin]]
name = "cargo-leptosx"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
dialoguer = { version = "=0.11.0", default-features = false, features = ["editor"] }
toml_edit = "=0.21.1"
anyhow = "1"

[dev-dependencies]
tempfile = "=3.10.1"

